# 模拟种子试训配置：未运行；正式训练前替换为业务审核通过的数据。
# 在Linux GPU环境的 /workspace/legal-finetune 目录运行。
model_name_or_path: Qwen/Qwen3-8B
stage: sft
do_train: true
finetuning_type: lora
quantization_method: bnb
quantization_bit: 4
quantization_type: nf4
double_quantization: true
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
dataset_dir: /workspace/legal-finetune/data
dataset: legal_train
eval_dataset: legal_validation
template: qwen3_nothink
# 必须先统计token长度；超限时优先裁剪上下文，禁止截断标准答案。
cutoff_len: 4096
train_on_prompt: false
mask_history: false
overwrite_cache: true
preprocessing_num_workers: 2
output_dir: /workspace/legal-finetune/output/qwen3-8b-legal-qlora-v1
logging_steps: 1
save_strategy: epoch
eval_strategy: epoch
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
plot_loss: true
report_to: none
seed: 20261021
